# Alembic configuration.
#
# The database URL is NOT set here: env.py reads it from app.config so there is
# one source of truth and no credentials land in a committed file.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# No post_write_hooks: resolving ruff via console_scripts fails inside a venv
# that was not pip-installed as a package. Format generated files yourself with
#   .venv/bin/ruff format alembic/versions/
[post_write_hooks]
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
