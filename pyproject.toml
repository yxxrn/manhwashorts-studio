[project]
name = "manhwashorts-studio"
version = "1.5.1"
description = "Auto YouTube Shorts generator for manhwa recaps - rights-aware, human-in-the-loop"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "slow: exercises real FFmpeg rendering; skip with -m 'not slow'",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI dependencies are function calls in defaults by design
    "SIM108", # ternaries are not always clearer than if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]      # fixtures import after sys.path setup
"scripts/*" = ["E402"]
