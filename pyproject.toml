[project]
name = "manhwashorts-studio"
version = "1.7.0"
description = "Auto YouTube Shorts generator for manhwa recaps - rights-aware, human-in-the-loop"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "slow: exercises long-running rendering or integration behavior",
    "ffmpeg: invokes or validates FFmpeg-backed media behavior",
    "unit: isolated unit-level behavior",
    "contracts: stable schema and behavioral contracts",
    "integration: multi-service integration behavior",
    "render: rendering, framing, subtitle, and thumbnail behavior",
    "production: end-to-end orchestration and release behavior",
    "migrations: database migration compatibility",
    "api: HTTP/API surface behavior",
    "cloud: cloud multimodal stage and resume behavior",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI dependencies are function calls in defaults by design
    "SIM108", # ternaries are not always clearer than if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]      # fixtures import after sys.path setup
"scripts/*" = ["E402"]
